  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script>
      // Early capture of beforeinstallprompt to ensure no browser install event is missed
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-install-ready', { detail: e }));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for Offline-First PWA capabilities safely
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
          try {
            navigator.serviceWorker.register('/sw.js')
              .then(registration => {
                // Service worker active
              })
              .catch(() => {
                // Silently swallow in restricted iframe contexts
              });
          } catch (e) {
            // Silently handled
          }
        });
      }
    </script>
  </body>
